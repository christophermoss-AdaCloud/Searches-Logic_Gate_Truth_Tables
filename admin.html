<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCSE Computer Science Lesson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        [v-cloak] { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-indigo-700 flex items-center gap-2">
                    <i data-lucide="cpu" class="w-8 h-8"></i> GCSE Computer Science
                </h1>
                <p class="text-slate-500 font-medium">Full Interactive Lesson: Algorithms & Logic</p>
            </div>
            <nav class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 overflow-x-auto no-scrollbar">
                <button onclick="setTab('welcome')" id="tab-welcome" class="nav-tab flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap bg-indigo-600 text-white shadow-md">
                    <i data-lucide="layout" class="w-4 h-4"></i> Start
                </button>
                <button onclick="setTab('searching')" id="tab-searching" class="nav-tab flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap text-slate-600 hover:bg-slate-100">
                    <i data-lucide="search" class="w-4 h-4"></i> Searching
                </button>
                <button onclick="setTab('efficiency')" id="tab-efficiency" class="nav-tab flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap text-slate-600 hover:bg-slate-100">
                    <i data-lucide="trending-up" class="w-4 h-4"></i> Efficiency
                </button>
                <button onclick="setTab('logic')" id="tab-logic" class="nav-tab flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap text-slate-600 hover:bg-slate-100">
                    <i data-lucide="zap" class="w-4 h-4"></i> Logic Gates
                </button>
                <button onclick="setTab('quiz')" id="tab-quiz" class="nav-tab flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap text-slate-600 hover:bg-slate-100">
                    <i data-lucide="help-circle" class="w-4 h-4"></i> Final Quiz
                </button>
            </nav>
        </header>

        <!-- Content Main Container -->
        <main id="main-content" class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden min-h-[600px]">
            <!-- Content will be injected here via JavaScript -->
        </main>

        <!-- Footer -->
        <footer class="mt-8 py-6 text-center text-slate-400 text-sm border-t border-slate-200">
            <p>© 2024 Computer Science GCSE Tutor • Curriculum v2.1</p>
            <div class="flex justify-center gap-6 mt-4">
                <span class="flex items-center gap-1"><i data-lucide="book-open" class="w-3.5 h-3.5"></i> Lesson Modules</span>
                <span class="flex items-center gap-1"><i data-lucide="cpu" class="w-3.5 h-3.5"></i> Systems Arch</span>
                <span class="flex items-center gap-1 font-mono text-[10px]">BUILD_STABLE_HTML</span>
            </div>
        </footer>
    </div>

    <script>
        // --- State Management ---
        let activeTab = 'welcome';
        let searchTarget = 42;
        let isSearching = false;
        let linearIndex = -1;
        let binaryRange = { low: 0, high: 9, mid: -1 };
        const searchArray = [10, 15, 22, 38, 42, 55, 67, 81, 92, 100];
        
        let gateInputs = { a: 0, b: 0 };
        
        let quizScore = 0;
        let currentQuestion = 0;
        let showResults = false;

        const questions = [
            { question: "Which search algorithm requires the list to be sorted first?", options: ["Linear Search", "Binary Search", "Both", "Neither"], answer: 1 },
            { question: "In a list of 1,000,000 items, what is the maximum number of guesses a Binary Search would take?", options: ["1,000,000", "500,000", "Around 20", "Around 1,000"], answer: 2 },
            { question: "What is the output of an AND gate if Input A is 1 and Input B is 0?", options: ["1", "0", "It depends", "Error"], answer: 1 },
            { question: "Which gate acts as an 'Inverter'?", options: ["AND", "OR", "NOT", "XOR"], answer: 2 },
            { question: "If you need a circuit to turn on a light when either switch A OR switch B is pressed, which gate do you use?", options: ["AND", "OR", "NOT", "NAND"], answer: 1 },
            { question: "What is the Big O notation for a Linear Search?", options: ["O(1)", "O(log n)", "O(n)", "O(n^2)"], answer: 2 },
            { question: "Which gate outputs 1 ONLY when the inputs are different (one is 1, one is 0)?", options: ["AND", "OR", "XOR", "NOT"], answer: 2 },
            { question: "If n = 8, how many steps does a Binary Search take in the worst case?", options: ["8", "4", "3", "1"], answer: 2 },
            { question: "Which of these is the most 'efficient' for searching a sorted list of 10 billion items?", options: ["Linear Search", "Binary Search", "Bubble Sort", "None"], answer: 1 },
            { question: "In a circuit: (A AND B) OR C. If A=1, B=1, C=0, what is the output?", options: ["0", "1", "Depends on C", "Invalid"], answer: 1 }
        ];

        // --- View Rendering ---
        function render() {
            const container = document.getElementById('main-content');
            
            // Update Tab UI
            document.querySelectorAll('.nav-tab').forEach(btn => {
                const id = btn.id.split('-')[1];
                if (id === activeTab) {
                    btn.className = 'nav-tab flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap bg-indigo-600 text-white shadow-md';
                } else {
                    btn.className = 'nav-tab flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap text-slate-600 hover:bg-slate-100';
                }
            });

            if (activeTab === 'welcome') {
                container.innerHTML = `
                <div class="p-8 md:p-16 fade-in">
                    <div class="max-w-3xl">
                        <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">GCSE Intensive (HTML)</span>
                        <h2 class="text-5xl font-extrabold mt-4 mb-6 text-slate-800 leading-tight">Mastering Algorithms <br/>& Digital Logic</h2>
                        <p class="text-xl text-slate-600 leading-relaxed mb-8">
                            Welcome back. In this session, we aren't just learning what search is—we're learning why some searches are <strong>mathematically superior</strong>.
                        </p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                            <div class="p-6 bg-blue-50 rounded-2xl border border-blue-100">
                                <i data-lucide="search" class="text-blue-600 mb-3 w-8 h-8"></i>
                                <h3 class="font-bold text-blue-900 text-lg">Search Power</h3>
                                <p class="text-sm text-blue-700">Understand Linear vs Binary Search.</p>
                            </div>
                            <div class="p-6 bg-emerald-50 rounded-2xl border border-emerald-100">
                                <i data-lucide="trending-up" class="text-emerald-600 mb-3 w-8 h-8"></i>
                                <h3 class="font-bold text-emerald-900 text-lg">Big O Efficiency</h3>
                                <p class="text-sm text-emerald-700">Learn why scale matters for big data.</p>
                            </div>
                            <div class="p-6 bg-amber-50 rounded-2xl border border-amber-100">
                                <i data-lucide="zap" class="text-amber-600 mb-3 w-8 h-8"></i>
                                <h3 class="font-bold text-amber-900 text-lg">Logic Gates</h3>
                                <p class="text-sm text-amber-700">Go under the hood of the CPU.</p>
                            </div>
                        </div>
                        <button onclick="setTab('searching')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-10 py-5 rounded-2xl font-bold text-xl transition-all flex items-center gap-3 group shadow-lg">
                            Enter Classroom <i data-lucide="arrow-right"></i>
                        </button>
                    </div>
                </div>`;
            } else if (activeTab === 'searching') {
                container.innerHTML = `
                <div class="p-6 md:p-10 fade-in">
                    <div class="flex flex-col md:flex-row justify-between items-start gap-4 mb-8">
                        <div>
                            <h2 class="text-3xl font-bold text-slate-800">The Battle of Searches</h2>
                            <p class="text-slate-500">Target Number: <strong>${searchTarget}</strong></p>
                        </div>
                        <div class="flex bg-slate-100 rounded-xl p-1">
                            <button onclick="setTarget(10)" class="px-3 py-1 rounded-lg text-xs font-bold ${searchTarget === 10 ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}">Target: 10</button>
                            <button onclick="setTarget(42)" class="px-3 py-1 rounded-lg text-xs font-bold ${searchTarget === 42 ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}">Target: 42</button>
                            <button onclick="setTarget(92)" class="px-3 py-1 rounded-lg text-xs font-bold ${searchTarget === 92 ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}">Target: 92</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div class="space-y-4">
                            <div class="bg-white p-5 rounded-2xl border-2 border-slate-100">
                                <h3 class="font-bold text-indigo-700 mb-2 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4"></i> Linear Search - O(n)</h3>
                                <p class="text-sm text-slate-600">Checks every item sequentially. Slow but simple.</p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border-2 border-slate-100">
                                <h3 class="font-bold text-green-700 mb-2 flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4"></i> Binary Search - O(log n)</h3>
                                <p class="text-sm text-slate-600">Divides the list in half each time. Extremely fast on sorted lists.</p>
                            </div>
                        </div>
                        <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-2xl">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="font-mono text-xs text-indigo-400">algorithm_playground.exe</h3>
                                <button onclick="resetSearch()" class="text-xs bg-slate-800 px-3 py-1 rounded-full"><i data-lucide="rotate-ccw" class="w-3 h-3 inline"></i> Reset</button>
                            </div>
                            <div class="flex justify-center gap-1 mb-8 overflow-x-auto no-scrollbar py-4">
                                ${searchArray.map((num, i) => {
                                    let style = "bg-slate-800 border-slate-700";
                                    if (linearIndex === i || binaryRange.mid === i) {
                                        style = num === searchTarget ? "bg-green-500 border-white scale-110" : (linearIndex === i ? "bg-red-500 border-white scale-110" : "bg-blue-500 border-white scale-110");
                                    } else if (binaryRange.mid !== -1 && (i < binaryRange.low || i > binaryRange.high)) {
                                        style = "bg-slate-950 opacity-20";
                                    }
                                    return `<div class="min-w-[38px] h-12 flex items-center justify-center rounded-lg border-2 text-sm font-bold transition-all duration-300 ${style}">${num}</div>`;
                                }).join('')}
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="runLinear()" ${isSearching ? 'disabled' : ''} class="bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl text-xs font-bold disabled:opacity-50">Run Linear</button>
                                <button onclick="runBinary()" ${isSearching ? 'disabled' : ''} class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl text-xs font-bold disabled:opacity-50">Run Binary</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button onclick="setTab('efficiency')" class="text-indigo-600 font-bold flex items-center gap-2">Next: Efficiency <i data-lucide="chevron-right"></i></button>
                    </div>
                </div>`;
            } else if (activeTab === 'efficiency') {
                container.innerHTML = `
                <div class="p-8 md:p-12 fade-in">
                    <h2 class="text-3xl font-bold mb-6 text-slate-800">Big O: Why Speed Matters</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="bg-slate-50 p-8 rounded-3xl border border-slate-200">
                            <h3 class="text-xl font-bold mb-6">Comparison Chart</h3>
                            <div class="space-y-8">
                                <div>
                                    <div class="flex justify-between text-sm font-bold mb-2"><span>Linear - O(n)</span><span class="text-red-500">Slowest</span></div>
                                    <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden"><div class="bg-red-400 h-full w-[90%] transition-all duration-1000"></div></div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-sm font-bold mb-2"><span>Binary - O(log n)</span><span class="text-emerald-500">Fastest</span></div>
                                    <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden"><div class="bg-emerald-400 h-full w-[10%] transition-all duration-1000"></div></div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-indigo-900 text-white p-8 rounded-3xl flex flex-col justify-center">
                            <p class="text-2xl font-serif italic mb-6">"In Binary Search, doubling the data only adds ONE single step to the search."</p>
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center"><i data-lucide="zap"></i></div>
                                <div><p class="font-bold text-sm">Key Fact</p><p class="text-indigo-300 text-xs">Search 8 billion people in just 33 steps.</p></div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end mt-12">
                         <button onclick="setTab('logic')" class="text-indigo-600 font-bold flex items-center gap-2">Next: Logic Gates <i data-lucide="chevron-right"></i></button>
                    </div>
                </div>`;
            } else if (activeTab === 'logic') {
                const labGate1 = gateInputs.a && gateInputs.b ? 1 : 0;
                const labFinal = !labGate1 ? 1 : 0;
                container.innerHTML = `
                <div class="p-6 md:p-10 fade-in">
                    <h2 class="text-3xl font-bold mb-8">Logic Gate Fundamentals</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                        <!-- Simplified Table Components -->
                        <div class="bg-white border rounded-2xl overflow-hidden shadow-sm">
                            <div class="bg-blue-600 p-2 text-white text-xs font-bold text-center">AND</div>
                            <div class="p-3 text-[10px] font-mono">
                                <div class="border-b mb-1 flex justify-between"><span>A</span><span>B</span><span class="text-blue-600">Q</span></div>
                                <div class="flex justify-between"><span>1</span><span>1</span><span class="font-bold">1</span></div>
                                <div class="opacity-40">Other states output 0</div>
                            </div>
                        </div>
                        <div class="bg-white border rounded-2xl overflow-hidden shadow-sm">
                            <div class="bg-amber-500 p-2 text-white text-xs font-bold text-center">OR</div>
                            <div class="p-3 text-[10px] font-mono">
                                <div class="border-b mb-1 flex justify-between"><span>A</span><span>B</span><span class="text-amber-600">Q</span></div>
                                <div class="flex justify-between"><span>0</span><span>0</span><span class="font-bold">0</span></div>
                                <div class="opacity-60 text-amber-600 font-bold">All others output 1</div>
                            </div>
                        </div>
                         <div class="bg-white border rounded-2xl overflow-hidden shadow-sm">
                            <div class="bg-rose-500 p-2 text-white text-xs font-bold text-center">NOT</div>
                            <div class="p-3 text-[10px] font-mono">
                                <div class="border-b mb-1 flex justify-between"><span>In</span><span class="text-rose-600">Q</span></div>
                                <div class="flex justify-between"><span>1</span><span class="font-bold">0</span></div>
                                <div class="flex justify-between"><span>0</span><span class="font-bold">1</span></div>
                            </div>
                        </div>
                        <div class="bg-white border rounded-2xl overflow-hidden shadow-sm">
                            <div class="bg-violet-600 p-2 text-white text-xs font-bold text-center">XOR</div>
                            <div class="p-3 text-[10px] font-mono">
                                <div class="border-b mb-1 flex justify-between"><span>A</span><span>B</span><span class="text-violet-600">Q</span></div>
                                <div class="flex justify-between font-bold"><span>Different</span><span>1</span></div>
                                <div class="flex justify-between font-bold"><span>Same</span><span>0</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-900 rounded-3xl p-8 text-white">
                        <h3 class="text-xl font-bold mb-6 text-indigo-400">Interactive Lab: Build a NAND Circuit</h3>
                        <div class="flex flex-col md:flex-row items-center justify-center gap-12">
                            <div class="space-y-4">
                                <button onclick="toggleInput('a')" class="flex items-center gap-3">
                                    <span class="text-xs font-mono">A:</span>
                                    <div class="w-12 h-6 rounded-full relative ${gateInputs.a ? 'bg-indigo-500' : 'bg-slate-700'}">
                                        <div class="w-4 h-4 bg-white rounded-full absolute top-1 ${gateInputs.a ? 'right-1' : 'left-1'} transition-all"></div>
                                    </div>
                                </button>
                                <button onclick="toggleInput('b')" class="flex items-center gap-3">
                                    <span class="text-xs font-mono">B:</span>
                                    <div class="w-12 h-6 rounded-full relative ${gateInputs.b ? 'bg-indigo-500' : 'bg-slate-700'}">
                                        <div class="w-4 h-4 bg-white rounded-full absolute top-1 ${gateInputs.b ? 'right-1' : 'left-1'} transition-all"></div>
                                    </div>
                                </button>
                            </div>
                            <div class="flex items-center gap-6">
                                <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700">
                                    <div class="text-[10px] opacity-40">AND</div>
                                    <div class="text-xl font-bold text-blue-400">${labGate1}</div>
                                </div>
                                <i data-lucide="arrow-right" class="text-slate-600"></i>
                                <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700">
                                    <div class="text-[10px] opacity-40">NOT</div>
                                    <div class="text-xl font-bold text-rose-400">${labFinal}</div>
                                </div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] opacity-40 mb-2">OUTPUT</div>
                                <div class="w-16 h-16 rounded-full flex items-center justify-center transition-all ${labFinal ? 'bg-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.5)]' : 'bg-slate-800'}">
                                    <i data-lucide="zap" class="${labFinal ? 'text-yellow-900' : 'text-slate-600'}"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end mt-10">
                        <button onclick="setTab('quiz')" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg">Start Final Quiz</button>
                    </div>
                </div>`;
            } else if (activeTab === 'quiz') {
                if (showResults) {
                    container.innerHTML = `
                    <div class="p-12 text-center fade-in">
                        <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="check-circle" class="w-12 h-12"></i>
                        </div>
                        <h2 class="text-4xl font-extrabold mb-2">Quiz Complete!</h2>
                        <p class="text-xl text-slate-500 mb-8">You scored <span class="text-indigo-600 font-bold">${quizScore} / ${questions.length}</span></p>
                        <button onclick="restartQuiz()" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold flex items-center gap-2 mx-auto">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Retake Quiz
                        </button>
                    </div>`;
                } else {
                    const q = questions[currentQuestion];
                    container.innerHTML = `
                    <div class="p-8 md:p-12 fade-in max-w-2xl mx-auto">
                        <div class="flex justify-between items-center mb-8">
                            <span class="text-xs font-bold text-slate-400 tracking-widest uppercase">Question ${currentQuestion + 1} of ${questions.length}</span>
                            <div class="w-32 h-1.5 bg-slate-100 rounded-full"><div class="h-full bg-indigo-500 rounded-full" style="width: ${((currentQuestion + 1) / questions.length) * 100}%"></div></div>
                        </div>
                        <h3 class="text-2xl font-bold mb-10 text-slate-800">${q.question}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${q.options.map((opt, i) => `
                                <button onclick="answerQuiz(${i})" class="w-full text-left p-6 rounded-2xl border-2 border-slate-100 hover:border-indigo-500 hover:bg-indigo-50 transition-all font-bold group flex justify-between items-center">
                                    <span>${opt}</span>
                                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>`;
                }
            }
            
            lucide.createIcons();
        }

        // --- Logic Functions ---
        function setTab(tab) {
            activeTab = tab;
            resetSearch(); // Stop any running animations
            render();
        }

        function setTarget(val) {
            searchTarget = val;
            resetSearch();
            render();
        }

        function resetSearch() {
            linearIndex = -1;
            binaryRange = { low: 0, high: 9, mid: -1 };
            isSearching = false;
            if (window.searchInterval) clearInterval(window.searchInterval);
            if (window.searchTimeout) clearTimeout(window.searchTimeout);
            render();
        }

        function runLinear() {
            resetSearch();
            isSearching = true;
            let current = -1;
            render();
            window.searchInterval = setInterval(() => {
                current++;
                linearIndex = current;
                render();
                if (searchArray[current] === searchTarget || current >= searchArray.length - 1) {
                    clearInterval(window.searchInterval);
                    isSearching = false;
                    render();
                }
            }, 400);
        }

        function runBinary() {
            resetSearch();
            isSearching = true;
            let low = 0;
            let high = searchArray.length - 1;
            
            function step() {
                if (low <= high) {
                    let mid = Math.floor((low + high) / 2);
                    binaryRange = { low, high, mid };
                    render();
                    
                    if (searchArray[mid] === searchTarget) {
                        isSearching = false;
                        render();
                        return;
                    }
                    
                    window.searchTimeout = setTimeout(() => {
                        if (searchArray[mid] < searchTarget) low = mid + 1;
                        else high = mid - 1;
                        binaryRange = { ...binaryRange, low, high };
                        render();
                        window.searchTimeout = setTimeout(step, 800);
                    }, 800);
                } else {
                    isSearching = false;
                    render();
                }
            }
            step();
        }

        function toggleInput(key) {
            gateInputs[key] = gateInputs[key] === 0 ? 1 : 0;
            render();
        }

        function answerQuiz(idx) {
            if (idx === questions[currentQuestion].answer) {
                quizScore++;
            }
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
            } else {
                showResults = true;
            }
            render();
        }

        function restartQuiz() {
            quizScore = 0;
            currentQuestion = 0;
            showResults = false;
            render();
        }

        // Initialize
        window.onload = () => render();

    </script>
</body>
</html>
